<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="240" viewBox="20 20 1230 260" role="img" aria-labelledby="title desc">
  <title id="title">TestSearch logo</title>
  <desc id="desc">A blue magnifying glass with a checkmark and motion lines next to the TestSearch wordmark.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1746D2"/>
    </linearGradient>
    <linearGradient id="lightBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
  </defs>
  <g transform="translate(115 70) scale(0.82)" filter="url(#softShadow)">
    <g fill="none" stroke="url(#lightBlue)" stroke-width="22" stroke-linecap="round">
      <path d="M0 82H112" opacity="0.95"/>
      <path d="M-34 132H104" opacity="0.88"/>
      <path d="M7 182H121" opacity="0.76"/>
    </g>

    <circle cx="180" cy="140" r="92" fill="#FFFFFF" stroke="url(#blue)" stroke-width="26"/>
    <path d="M141 138L169 166L223 111" fill="none" stroke="url(#blue)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M247 209L318 280" fill="none" stroke="#0B1F53" stroke-width="35" stroke-linecap="round"/>
  </g>

  <g transform="translate(420 177)">
    <text x="0" y="0" font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="-4">
      <tspan fill="#071D56">Test</tspan><tspan fill="#2563EB">Search</tspan>
    </text>
  </g>
</svg>
